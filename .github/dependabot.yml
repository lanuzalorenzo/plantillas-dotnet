version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/templates/ll-api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Los paquetes LL.* viven en shared-dotnet y la versión está fijada a mano:
      # se sube cuando se publica una versión nueva y pasa el CI.
      - dependency-name: "LL.*"
    groups:
      nuget-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

