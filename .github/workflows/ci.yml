name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Plantilla de API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generar, compilar y probar la plantilla
        run: ./scripts/verify-template.sh

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.3
