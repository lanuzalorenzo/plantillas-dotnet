name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    # «Plantilla de API» es el nombre del check obligatorio de main; el trabajo
    # verifica todas las plantillas desde que entró ll-blazor.
    name: Plantilla de API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generar, compilar y probar la plantilla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-template.sh

  template-docker:
    name: Contenedor de la plantilla Blazor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generar la plantilla
        run: |
          dotnet new install ./templates/ll-blazor
          dotnet new ll-blazor -n SampleWeb -o /tmp/sample-web

      - name: Construir la imagen
        run: docker build -t sample-web /tmp/sample-web

      - name: Comprobar la configuración de nginx
        run: docker run --rm sample-web nginx -t

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.3
