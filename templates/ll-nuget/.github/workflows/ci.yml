name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato, pruebas y paquete (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar la versión de plataforma
        uses: lanuzalorenzo/core/actions/check-platform@v1.8

      - name: Compilar, verificar formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.8
        with:
          solution: CompanyPackage.slnx
          dotnet-version: '10.0.x'

      - name: Empaquetar y comprobar el contenido
        run: |
          set -euo pipefail
          dotnet pack CompanyPackage.slnx -c Release --no-build -o "$RUNNER_TEMP/paquetes"
          nupkg="$(find "$RUNNER_TEMP/paquetes" -name '*.nupkg' -print -quit)"
          test -n "$nupkg"
          listado="$(unzip -l "$nupkg")"
          grep -Eq 'lib/[^/]+/[^/]+\.dll' <<< "$listado"
          grep -q 'README.md' <<< "$listado"

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.8

  sast:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Analizar con CodeQL
        uses: lanuzalorenzo/core/actions/sast@v1.8
        with:
          languages: csharp
          dotnet-version: '10.0.x'

  sca:
    name: Dependencias (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar para generar los manifiestos
        run: |
          dotnet restore CompanyPackage.slnx
          dotnet build CompanyPackage.slnx -c Release --no-restore

      - name: Escanear dependencias con Trivy
        uses: lanuzalorenzo/core/actions/scan@v1.8
        with:
          scan-type: fs
          scan-ref: .
