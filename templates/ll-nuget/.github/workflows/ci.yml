name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato, pruebas y paquete (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Compilar, verificar formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.4
        with:
          solution: CompanyPackage.slnx
          dotnet-version: '10.0.x'

      - name: Empaquetar y comprobar el contenido
        run: |
          set -euo pipefail
          dotnet pack CompanyPackage.slnx -c Release --no-build -o "$RUNNER_TEMP/paquetes"
          nupkg="$(find "$RUNNER_TEMP/paquetes" -name '*.nupkg' -print -quit)"
          test -n "$nupkg"
          listado="$(unzip -l "$nupkg")"
          grep -Eq 'lib/[^/]+/[^/]+\.dll' <<< "$listado"
          grep -q 'README.md' <<< "$listado"

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.4
