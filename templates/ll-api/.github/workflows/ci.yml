name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Compilar, verificar formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.6
        with:
          solution: CompanyApi.slnx
          dotnet-version: '10.0.x'

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.6

  sast:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Analizar con CodeQL
        uses: lanuzalorenzo/core/actions/sast@v1.6
        with:
          languages: csharp
          dotnet-version: '10.0.x'

  sca:
    name: Dependencias (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar para generar los manifiestos
        run: |
          dotnet restore CompanyApi.slnx
          dotnet build CompanyApi.slnx -c Release --no-restore

      - name: Escanear dependencias con Trivy
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: fs
          scan-ref: .

  container-security:
    name: Contenedor (hardening y escaneo)
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      # `container-publish` no deja la imagen en el daemon con `push: false`;
      # el escaneo siguiente necesita la imagen local. Se sustituye por la acción
      # cuando exponga `load`.
      - name: Construir la imagen
        run: >
          docker build
          --secret id=github_token,env=GH_PACKAGES_TOKEN
          -t company-api:${GITHUB_SHA}
          -f Dockerfile .

      - name: Verificar que el contenedor no ejecuta como root
        run: |
          container_uid="$(docker run --rm --entrypoint id company-api:${GITHUB_SHA} -u)"
          echo "UID del contenedor: ${container_uid}"
          test "${container_uid}" != "0"

      - name: Escanear la imagen con Trivy
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: image
          image-ref: company-api:${{ github.sha }}

  dependency-review:
    name: Revisión de dependencias (solo PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Revisar cambios de dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
