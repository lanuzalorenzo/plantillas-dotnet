name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar la versión de plataforma
        uses: lanuzalorenzo/core/actions/check-platform@v1.8

      - name: Compilar, verificar formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.8
        with:
          solution: CompanyApi.slnx
          dotnet-version: '10.0.x'

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.8

  sast:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - name: Compilar para CodeQL
        uses: github/codeql-action/autobuild@v4

      # `core/actions/sast@v1.8` no permite separar análisis y publicación, así
      # que los pasos van aquí: en un repositorio privado sin GitHub Advanced
      # Security el SARIF no se puede subir, pero el análisis corre igual y su
      # fallo bloquea. Solo se omite la publicación (`upload` es
      # always/never/failure-only, no booleano).
      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}

  sca:
    name: Dependencias (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar para generar los manifiestos
        run: |
          dotnet restore CompanyApi.slnx
          dotnet build CompanyApi.slnx -c Release --no-restore

      - name: Escanear dependencias con Trivy
        uses: lanuzalorenzo/core/actions/scan@v1.8
        with:
          scan-type: fs
          scan-ref: .
          upload: ${{ github.event.repository.visibility == 'public' }}

  container-security:
    name: Contenedor (hardening y escaneo)
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Construir la imagen
        id: image
        # El nombre de la imagen es el del proyecto, en kebab-case: la
        # generación de la plantilla sustituye el nombre de ejemplo por el del
        # proyecto creado.
        uses: lanuzalorenzo/core/actions/container-publish@v1.8
        with:
          image: company-api
          push: false
          load: true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Verificar que el contenedor no ejecuta como root
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          container_uid="$(docker run --rm --entrypoint id "${IMAGE_TAG}" -u)"
          echo "UID del contenedor: ${container_uid}"
          test "${container_uid}" != "0"

      - name: Escanear la imagen con Trivy
        uses: lanuzalorenzo/core/actions/scan@v1.8
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.tag }}
          upload: ${{ github.event.repository.visibility == 'public' }}

  dependency-review:
    name: Revisión de dependencias (solo PR)
    # Exige GitHub Advanced Security, que un repositorio privado no tiene: se
    # activa el día que se publique, sin editar el workflow.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Revisar cambios de dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
