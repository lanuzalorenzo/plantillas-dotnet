name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Fusionar parches y mejoras menores
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Leer el tipo de actualización
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type es el mayor cambio del lote: un grupo patch+minor no se
      # cuela como major y un grupo con un major no se fusiona.
      - name: Activar la fusión automática
        if: >-
          steps.dependabot.outputs.update-type == 'version-update:semver-patch' ||
          steps.dependabot.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh pr merge "$PR" --auto --squash; then
            exit 0
          fi
          # Sin auto-merge nativo (repo privado sin plan de pago): se espera
          # a que el CI complete y se fusiona el mismo commit validado.
          for _ in $(seq 1 60); do
            total=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup | length')
            [ "$total" -gt 0 ] && break
            sleep 10
          done
          sleep 20
          gh pr checks "$PR" --watch --interval 15
          sha=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$sha"

  refresh:
    name: Actualizar ramas de Dependabot
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - name: Poner al día las PRs abiertas de Dependabot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! prs=$(gh pr list --state open --limit 100 --json number,author,headRefName,baseRefName \
            --jq '.[] | select(.author.login == "app/dependabot" and .baseRefName == "main") | "\(.number) \(.headRefName)"'); then
            echo "::error::No se pudo listar las PRs de Dependabot."
            exit 1
          fi
          if [ -z "$prs" ]; then
            echo "::notice::No hay PRs abiertas de Dependabot contra main."
            exit 0
          fi
          while read -r pr branch; do
            [ -n "$pr" ] || continue
            before=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
            if output=$(gh api -X PUT \
              "repos/${GH_REPO}/pulls/${pr}/update-branch" \
              -f expected_head_sha="$before" 2>&1); then
              changed=false
              for _ in $(seq 1 12); do
                after=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
                if [ "$after" != "$before" ]; then
                  changed=true
                  break
                fi
                sleep 5
              done
              if [ "$changed" != true ]; then
                echo "::warning::La PR #${pr} no cambió de head tras update-branch; no se despacha CI."
                continue
              fi
              # El commit de update-branch lo firma GITHUB_TOKEN, así que su
              # synchronize no dispara CI. Se lanza el workflow a mano sobre
              # la rama ya actualizada.
              gh workflow run ci.yml --ref "$branch"
            elif printf '%s' "$output" | grep -qE 'merge conflict between base and head|already up to date|HTTP 422'; then
              echo "::notice::PR #${pr} sin actualización: ${output}"
            else
              echo "::error::No se pudo actualizar la PR #${pr}: ${output}"
              exit 1
            fi
          done <<< "$prs"
